<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Logo GCM-style — Windermere Concrete</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--pine:#c9a84c;--gold2:#f0d98c;--lake:#080c10;--card:#151d28;--hairline:rgba(201,168,76,.16);--ink:#eef2f6;--ink-soft:#93a0ae}
  *{box-sizing:border-box}
  body{margin:0;background:var(--lake);color:var(--ink);font-family:'Inter',sans-serif}
  .intro{padding:40px 24px 30px;text-align:center}
  h1{margin:0 auto 8px;font-family:'Playfair Display',serif;font-weight:800;font-size:28px;color:#fff}
  main{width:min(900px,calc(100% - 32px));margin:0 auto 60px}
  .nav-demo{display:flex;align-items:center;padding:16px 24px;background:rgba(8,12,16,.72);border:1px solid var(--hairline);border-radius:10px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:46px;height:46px}
  .brand-copy{display:flex;flex-direction:column;line-height:1}
  .brand-name{font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff}
  .brand-sub{margin-top:6px;color:var(--gold2);font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
  .foot-demo{display:flex;align-items:center;gap:14px;padding:22px 24px;background:#0c0e11;border-radius:10px;margin-bottom:16px}
  .foot-demo img{width:58px;height:58px}
  .foot-demo strong{display:block;font-family:'Playfair Display',serif;font-size:18px;color:#fff}
  .foot-demo span{display:block;margin-top:6px;color:var(--gold2);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--hairline);border-radius:8px;padding:12px 16px}
  .chip img{display:block}
  .chip span{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
  <header class="intro"><h1>W estilo GCM &mdash; testado no fundo real do site</h1></header>
  <main>
    <div class="nav-demo"><div class="brand"><img src="/images/logo-gcm-style-w-cutout.png" alt=""><div class="brand-copy"><span class="brand-name">Windermere</span><span class="brand-sub">Concrete &middot; Hardscape</span></div></div></div>
    <div class="foot-demo"><img src="/images/logo-gcm-style-w-cutout.png" alt=""><div><strong>Windermere Concrete</strong><span>Finished to estate standard</span></div></div>
    <div class="row">
      <div class="chip"><img src="/images/logo-gcm-style-w-cutout.png" width="32" height="32" alt=""><span>32px header</span></div>
      <div class="chip"><img src="/images/logo-gcm-style-w-cutout.png" width="24" height="24" alt=""><span>24px</span></div>
      <div class="chip"><img src="/images/logo-gcm-style-w-cutout.png" width="16" height="16" alt=""><span>16px favicon</span></div>
    </div>
  </main>
</body>
</html>
